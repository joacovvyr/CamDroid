name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify bundled local model
        run: echo '1a380d3744103e11ef343534aaff54815cae40769dcd00c023652a7e5bc47f4b  app/src/main/assets/ESRGAN.tflite' | sha256sum --check
      - run: gradle assembleDebug lintDebug --stacktrace
      - name: Verify offline APK permissions
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions app/build/outputs/apk/debug/app-debug.apk > apk-permissions.txt
          cat apk-permissions.txt
          if grep -q 'android.permission.INTERNET' apk-permissions.txt; then
            echo "Offline app must not have Internet permission"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: CamDroid-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
